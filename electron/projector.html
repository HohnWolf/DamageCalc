<!doctype html>
<html lang="de" data-theme="oled">
<head>
<meta charset="utf-8">
<title>Rattata Labs – Projektor</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #e8e9ec;
    font-family: "Segoe UI", system-ui, sans-serif; }
  #view { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; display: block; background: #000; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9aa0aa; font-size: 18px; pointer-events: none; }
  #empty[hidden] { display: none; }
  /* Overlay liegt über dem Bild, nimmt aber keine Klicks an (Rechtsklick öffnet das Menü der Seite). */
  #ov { position: absolute; z-index: 2; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; background-color: transparent; pointer-events: none; }
  #ov[hidden] { display: none; }
  body.no-cursor, body.no-cursor * { cursor: none !important; }
  body.menu-open, body.menu-open * { cursor: default !important; }
  #menu { position: absolute; z-index: 5; min-width: 240px; max-width: 360px; padding: 4px;
    background: #1b1d21; color: #e8e9ec; border: 1px solid #2a2a30; border-radius: 6px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .5); }
  #menu[hidden] { display: none; }
  #menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; color: inherit; border: 0; border-radius: 4px; padding: 8px 10px;
    font: inherit; font-size: 13px; cursor: pointer; }
  #menu button:hover, #menu button:focus { background: #29292f; outline: none; }
  #menu .sep { height: 1px; margin: 4px 6px; background: #2a2a30; }
  #menu .vol { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 13px; }
  #menu .vol input { flex: 1; min-width: 80px; accent-color: #f2c94c; }
  #ahint { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 4; text-align: center;
    color: #f2c94c; font-size: 14px; text-shadow: 0 1px 2px #000; pointer-events: none; }
  #ahint[hidden] { display: none; }
  #diag { position: absolute; z-index: 4; left: 8px; bottom: 8px; max-width: calc(100% - 16px);
    padding: 6px 8px; background: rgba(0, 0, 0, .72); color: #fff; border-radius: 4px;
    font: 12px/1.45 Consolas, ui-monospace, monospace; pointer-events: none; white-space: pre; }
  #diag[hidden] { display: none; }
  #menu .mark { width: 1.1em; flex: none; text-align: center; }
  html[data-theme="light"] #menu { background: #fff; color: #1b1e23; border-color: #d5d8de; box-shadow: 0 10px 28px rgba(0, 0, 0, .18); }
  html[data-theme="light"] #menu button:hover, html[data-theme="light"] #menu button:focus { background: #e8eaee; }
  html[data-theme="light"] #menu .sep { background: #e5e7eb; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="empty">Keine Aufnahme</div>
<iframe id="ov" hidden title="Overlay" allowtransparency="true"></iframe>
<div id="diag" hidden></div>
<div id="ahint" hidden>Diese Quelle liefert keinen Ton.</div>
<div id="menu" hidden role="menu"></div>
<script>
(function () {
  var S = {
    de: { empty: 'Keine Aufnahme', fs: 'Vollbild', win: 'Fenstermodus', onTop: 'Immer im Vordergrund',
      cursor: 'Mauszeiger ausblenden', overlay: 'Overlay', sound: 'Ton', volume: 'Lautstärke',
      noAudio: 'Diese Quelle liefert keinen Ton.', diag: 'Diagnose', close: 'Schließen', mon: 'Monitor {0} · {1}×{2}',
      diagLine: '{0} Bilder/s\nBild {1}×{2}\nQuelle {3}×{4}' },
    en: { empty: 'No capture', fs: 'Fullscreen', win: 'Windowed', onTop: 'Always on top',
      cursor: 'Hide cursor', overlay: 'Overlay', sound: 'Sound', volume: 'Volume',
      noAudio: 'This source has no audio.', diag: 'Diagnostics', close: 'Close', mon: 'Monitor {0} · {1}×{2}',
      diagLine: '{0} frames/s\nframe {1}×{2}\nsource {3}×{4}' }
  };
  var lang = 'de', opts = { overlay: true, hideCursor: false, onTop: false, fullscreen: false, displayId: null, theme: 'oled', sound: true, volume: 80 };
  var canvas = document.getElementById('view'), ctx = canvas.getContext('2d', { alpha: false });
  var empty = document.getElementById('empty'), frame = document.getElementById('ov'), menu = document.getElementById('menu');
  var ahint = document.getElementById('ahint');
  var D = window.desktop && window.desktop.projector;
  var lastFrame = 0, pending = null, drawing = false, bmpW = 0, bmpH = 0, diagOn = false;
  var stat = { n: 0, fps: 0, w: 0, h: 0, sw: 0, sh: 0, winT: Date.now(), winN: 0, logged: false };
  window.__projectorFrames = stat;

  function t(k) {
    var s = (S[lang] || S.de)[k] || k, a = arguments;
    for (var i = 1; i < a.length; i++) s = s.split('{' + (i - 1) + '}').join(a[i]);
    return s;
  }
  function layout() {
    var dpr = window.devicePixelRatio || 1;
    var w = Math.max(2, Math.round(window.innerWidth * dpr));
    var h = Math.max(2, Math.round(window.innerHeight * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  }
  function paint(bmp) {
    layout();
    var cw = canvas.width, ch = canvas.height;
    var s = Math.min(cw / bmp.width, ch / bmp.height);
    var dw = bmp.width * s, dh = bmp.height * s;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cw, ch);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bmp, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
  }
  function noteFrame(w, h, sw, sh) {
    stat.n++; stat.winN++; stat.w = w || stat.w; stat.h = h || stat.h;
    if (sw) stat.sw = sw; if (sh) stat.sh = sh;
    var dt = Date.now() - stat.winT;
    if (dt >= 500) { stat.fps = Math.round(stat.winN * 1000 / dt); stat.winT = Date.now(); stat.winN = 0; }
    if (!stat.logged) { stat.logged = true; console.info('Projektor: erstes Bild', stat.w + '×' + stat.h, 'Quelle', stat.sw + '×' + stat.sh); }
    paintDiag();
  }
  function diagText() { return t('diagLine', stat.fps, stat.w || 0, stat.h || 0, stat.sw || 0, stat.sh || 0); }
  function paintDiag() {
    var box = document.getElementById('diag');
    if (!box) return;
    box.hidden = !diagOn;
    if (diagOn) box.textContent = diagText();
  }
  function paintBitmap(bmp, w, h, sw, sh) {
    if (!bmp) return;
    layout();
    var cw = canvas.width, ch = canvas.height, bw = (bmp.width > 1 ? bmp.width : w) || 2, bh = (bmp.height > 1 ? bmp.height : h) || 2;
    var s = Math.min(cw / bw, ch / bh);
    var dw = bw * s, dh = bh * s;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cw, ch);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bmp, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
    try { bmp.close(); } catch (e) { /* schon geschlossen */ }
    bmpW = bw; bmpH = bh;
    lastFrame = Date.now();
    empty.hidden = true;
    noteFrame(bw, bh, sw, sh);
  }
  function pump() {
    if (drawing || !pending) return;
    drawing = true;
    var msg = pending; pending = null;
    createImageBitmap(new Blob([msg.buf], { type: 'image/jpeg' })).then(function (bmp) {
      bmpW = bmp.width; bmpH = bmp.height;
      paint(bmp); bmp.close();
      lastFrame = Date.now();
      empty.hidden = true;
      noteFrame(bmpW, bmpH, msg.sw, msg.sh);
    }, function (err) { console.error('Projektor: JPEG', err); }).then(function () {
      drawing = false;
      if (pending) pump();
    });
  }
  function onPort(p) {
    if (!p) return;
    try { if (p.start) p.start(); } catch (e) { /* schon gestartet */ }
    p.onmessage = function (ev) {
      var d = ev.data || {};
      if (d.kind === 'audio-status' && d.ok === false) { ahint.hidden = false; ahint.textContent = t('noAudio'); return; }
      if (d.kind === 'bmp' && d.bmp) { paintBitmap(d.bmp, d.w, d.h, d.sw, d.sh); return; }
      // Nur das JPEG aus dem rohen Video. Kein Canvas mit Rahmen.
      if (d.kind !== 'jpeg' || !d.buf) return;
      pending = d;
      pump();
    };
  }
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.type !== 'rl-projector-port') return;
    onPort(ev.ports && ev.ports[0]);
  });
  window.addEventListener('resize', function () { layout(); });
  setInterval(function () {
    if (diagOn) console.info('Projektor Diagnose', diagText().replace(/\n/g, ' · '));
    else if (stat.n && (!lastFrame || Date.now() - lastFrame > 2000)) console.warn('Projektor: keine neuen Bilder', diagText().replace(/\n/g, ' · '));
  }, 2000);
  setInterval(function () {
    if (!lastFrame || Date.now() - lastFrame < 1500) return;
    lastFrame = 0;
    layout();
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    empty.hidden = false;
    empty.textContent = t('empty');
  }, 400);

  function transparentOverlay(url) {
    if (!url) return '';
    if (/[?&]transparent=1(?:&|$)/.test(url)) return url;
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'transparent=1';
  }
  function apply(o) {
    if (!o) return;
    opts = o;
    lang = o.lang === 'en' ? 'en' : 'de';
    document.documentElement.lang = lang;
    document.documentElement.setAttribute('data-theme', o.theme === 'light' ? 'light' : 'oled');
    document.body.classList.toggle('no-cursor', !!o.hideCursor);
    empty.textContent = t('empty');
    if (ahint) ahint.textContent = t('noAudio');
    if (o.overlay && o.overlayUrl) {
      var src = transparentOverlay(o.overlayUrl);
      if (frame.getAttribute('src') !== src) frame.src = src;
      frame.hidden = false;
    } else frame.hidden = true;
  }
  function hideMenu() { menu.hidden = true; document.body.classList.remove('menu-open'); }
  function item(label, on, fn) {
    var b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'menuitem');
    var m = document.createElement('span'); m.className = 'mark'; m.textContent = on ? '✓' : '';
    b.appendChild(m); b.appendChild(document.createTextNode(label));
    b.addEventListener('click', function () { hideMenu(); fn(); });
    menu.appendChild(b);
  }
  function sep() { var d = document.createElement('div'); d.className = 'sep'; menu.appendChild(d); }
  function openMenu(x, y) {
    if (!D) return;
    D.displays().then(function (list) {
      menu.innerHTML = '';
      (list || []).forEach(function (d) {
        var on = !!opts.fullscreen && opts.displayId === d.id;
        item(t('mon', d.n, d.w, d.h) + (d.primary ? '' : ''), on, function () {
          D.set({ fullscreen: true, displayId: d.id });
        });
      });
      item(t('win'), !opts.fullscreen, function () { D.set({ fullscreen: false }); });
      sep();
      item(t('onTop'), !!opts.onTop, function () { D.set({ onTop: !opts.onTop }); });
      item(t('cursor'), !!opts.hideCursor, function () { D.set({ hideCursor: !opts.hideCursor }); });
      item(t('overlay'), opts.overlay !== false, function () { D.set({ overlay: opts.overlay === false }); });
      item(t('diag'), diagOn, function () {
        diagOn = !diagOn;
        paintDiag();
        console.info('Projektor Diagnose', diagOn ? diagText().replace(/\n/g, ' · ') : 'aus');
      });
      sep();
      item(t('sound'), opts.sound !== false, function () { D.set({ sound: opts.sound === false }); });
      var vol = document.createElement('label');
      vol.className = 'vol';
      var cap = document.createElement('span'); cap.textContent = t('volume');
      var range = document.createElement('input');
      range.type = 'range'; range.min = '0'; range.max = '100'; range.step = '1';
      range.value = String(opts.volume == null ? 80 : opts.volume);
      range.setAttribute('aria-label', t('volume'));
      range.addEventListener('input', function () { opts.volume = +range.value; opts.sound = true; D.set({ volume: +range.value, sound: true }); });
      range.addEventListener('click', function (ev) { ev.stopPropagation(); });
      vol.appendChild(cap); vol.appendChild(range);
      menu.appendChild(vol);
      sep();
      item(t('close'), false, function () { D.close(); });
      menu.hidden = false;
      document.body.classList.add('menu-open');
      var mw = menu.offsetWidth, mh = menu.offsetHeight;
      var left = Math.max(4, Math.min(x, window.innerWidth - mw - 4));
      var top = Math.max(4, Math.min(y, window.innerHeight - mh - 4));
      menu.style.left = left + 'px'; menu.style.top = top + 'px';
    }, function () {});
  }
  document.addEventListener('contextmenu', function (ev) {
    ev.preventDefault();
    openMenu(ev.clientX, ev.clientY);
  });
  document.addEventListener('mousedown', function (ev) {
    if (!menu.hidden && !menu.contains(ev.target)) hideMenu();
  });
  window.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (!menu.hidden) { hideMenu(); return; }
      if (D) D.leaveFullscreen();
    }
  });
  window.addEventListener('blur', hideMenu);
  if (D) {
    D.onOpts(apply);
    D.onShowMenu(function (pos) { openMenu((pos && pos.x) || 28, (pos && pos.y) || 28); });
    D.state().then(apply, function () {});
  }
  layout();
  // Für den Test: ob der Rahmen mitgezeichnet wurde, sieht man am Bild. Hier nur die Rohdaten.
  window.__projectorFrame = function () { return { w: bmpW, h: bmpH, overlay: !frame.hidden }; };
})();
</script>
</body>
</html>
