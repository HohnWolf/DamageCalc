<!doctype html>
<html lang="de" data-theme="oled">
<head>
<meta charset="utf-8">
<title>Rattata Labs – Projektor</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #e8e9ec;
    font-family: "Segoe UI", system-ui, sans-serif; }
  #view { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; display: block; object-fit: contain; background: #000; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9aa0aa; font-size: 18px; pointer-events: none; }
  #empty[hidden] { display: none; }
  /* Der Zähler ist nur so groß wie die Karte. Klicks gehen durch, außer beim Verschieben. */
  #counter { position: absolute; z-index: 2; left: 2%; top: 2%; transform-origin: 0 0; pointer-events: none; }
  #counter[hidden] { display: none; }
  #counter.edit { pointer-events: auto; outline: 1px dashed rgba(242, 201, 76, .95); outline-offset: 3px; cursor: move; }
  #ov { position: relative; display: block; width: 280px; height: 120px; border: 0; background: transparent; background-color: transparent; pointer-events: none; }
  #ov[hidden] { display: none; }
  body.no-cursor, body.no-cursor * { cursor: none !important; }
  body.counter-edit, body.counter-edit #counter { cursor: move !important; }
  body.menu-open, body.menu-open * { cursor: default !important; }
  #menu { position: absolute; z-index: 5; min-width: 240px; max-width: 360px; padding: 4px;
    background: #1b1d21; color: #e8e9ec; border: 1px solid #2a2a30; border-radius: 6px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .5); }
  #menu[hidden] { display: none; }
  #menu button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: transparent; color: inherit; border: 0; border-radius: 4px; padding: 8px 10px;
    font: inherit; font-size: 13px; cursor: pointer; }
  #menu button:hover, #menu button:focus { background: #29292f; outline: none; }
  #menu .sep { height: 1px; margin: 4px 6px; background: #2a2a30; }
  #menu .vol { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 13px; }
  #menu .vol input { flex: 1; min-width: 80px; accent-color: #f2c94c; }
  #ahint { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 4; text-align: center;
    color: #f2c94c; font-size: 14px; text-shadow: 0 1px 2px #000; pointer-events: none; }
  #ahint[hidden] { display: none; }
  #diag { position: absolute; z-index: 4; left: 8px; bottom: 8px; max-width: calc(100% - 16px);
    padding: 6px 8px; background: rgba(0, 0, 0, .72); color: #fff; border-radius: 4px;
    font: 12px/1.45 Consolas, ui-monospace, monospace; pointer-events: none; white-space: pre; }
  #diag[hidden] { display: none; }
  #menu .mark { width: 1.1em; flex: none; text-align: center; }
  /* Modus Neu: eigene GPU-Ebenen, das Overlay malt nie das Spielbild mit */
  body.fast #view { will-change: transform; }
  body.fast #counter { contain: layout paint style; will-change: transform; }
  html[data-theme="light"] #menu { background: #fff; color: #1b1e23; border-color: #d5d8de; box-shadow: 0 10px 28px rgba(0, 0, 0, .18); }
  html[data-theme="light"] #menu button:hover, html[data-theme="light"] #menu button:focus { background: #e8eaee; }
  html[data-theme="light"] #menu .sep { background: #e5e7eb; }
</style>
</head>
<body>
<video id="view" autoplay playsinline></video>
<div id="empty">Keine Aufnahme</div>
<div id="counter" hidden><iframe id="ov" hidden title="Overlay" allowtransparency="true"></iframe></div>
<div id="diag" hidden></div>
<div id="ahint" hidden>Diese Quelle liefert keinen Ton.</div>
<div id="menu" hidden role="menu"></div>
<script>
(function () {
  var S = {
    de: { empty: 'Keine Aufnahme', fs: 'Vollbild', win: 'Fenstermodus', onTop: 'Immer im Vordergrund',
      cursor: 'Mauszeiger ausblenden', overlay: 'Overlay', sound: 'Ton', volume: 'Lautstärke',
      noAudio: 'Diese Quelle liefert keinen Ton.', diag: 'Diagnose', counter: 'Zähler anzeigen', move: 'Zähler verschieben',
      counterSize: 'Zählergröße', resetPos: 'Position zurücksetzen', close: 'Schließen', mon: 'Monitor {0} · {1}×{2}',
      diagLine: '{0} Bilder/s\nBild {1}×{2}\nverworfen {3}\nLatenz {4}\nModus {5}', mode: 'Modus: Neu (schnell)', latNone: '–' },
    en: { empty: 'No capture', fs: 'Fullscreen', win: 'Windowed', onTop: 'Always on top',
      cursor: 'Hide cursor', overlay: 'Overlay', sound: 'Sound', volume: 'Volume',
      noAudio: 'This source has no audio.', diag: 'Diagnostics', counter: 'Show counter', move: 'Move counter',
      counterSize: 'Counter size', resetPos: 'Reset position', close: 'Close', mon: 'Monitor {0} · {1}×{2}',
      diagLine: '{0} frames/s\nframe {1}×{2}\ndropped {3}\nlatency {4}\nmode {5}', mode: 'Mode: New (fast)', latNone: '–' }
  };
  var lang = 'de', opts = { overlay: true, hideCursor: false, onTop: false, fullscreen: false, displayId: null, theme: 'oled', sound: true, volume: 80, counterX: 2, counterY: 2, counterScale: 100 };
  var counter = document.getElementById('counter'), counterEdit = false;
  var video = document.getElementById('view');
  var empty = document.getElementById('empty'), frame = document.getElementById('ov'), menu = document.getElementById('menu');
  var ahint = document.getElementById('ahint');
  var D = window.desktop && window.desktop.projector;
  var lastFrame = 0, diagOn = false, watching = false;
  var stat = { n: 0, fps: 0, w: 0, h: 0, dropped: 0, winT: 0, winN: 0, logged: false, lat: -1, latSum: 0, latN: 0 };
  function fast() { return opts.mode === 'fast'; }
  window.__projectorFrames = stat;
  window.__projectorHear = { peak: 0, underruns: 0, playing: false };

  function t(k) {
    var s = (S[lang] || S.de)[k] || k, a = arguments;
    for (var i = 1; i < a.length; i++) s = s.split('{' + (i - 1) + '}').join(a[i]);
    return s;
  }
  function diagText() { return t('diagLine', stat.fps, stat.w || 0, stat.h || 0, stat.dropped || 0, stat.lat >= 0 ? Math.round(stat.lat) + ' ms' : t('latNone'), fast() ? 'neu' : 'aktuell'); }
  function paintDiag() {
    var box = document.getElementById('diag');
    if (!box) return;
    box.hidden = !diagOn;
    if (diagOn) box.textContent = diagText();
  }
  function applySound() {
    var on = opts.sound !== false;
    video.muted = !on;
    var vol = opts.volume == null ? 80 : +opts.volume;
    video.volume = Math.max(0, Math.min(1, vol / 100));
    window.__projectorHear.playing = on && !video.paused;
  }
  function tapAudio(stream) {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || tapAudio.done) return;
    tapAudio.done = true;
    try {
      var ctx = new AC({ latencyHint: 'interactive' });
      tapAudio.stop = function () { try { clearInterval(tapAudio.timer); ctx.close(); } catch (e) { /* schon zu */ } tapAudio.done = false; tapAudio.stop = null; };
      var src = ctx.createMediaStreamSource(stream);
      var an = ctx.createAnalyser();
      an.fftSize = 1024;
      src.connect(an);
      var wave = new Uint8Array(an.fftSize), ready = false;
      ctx.onstatechange = function () {
        if (ctx.state === 'running') ready = true;
        else if (ready && (ctx.state === 'interrupted' || ctx.state === 'suspended')) window.__projectorHear.underruns++;
      };
      if (ctx.resume) ctx.resume();
      tapAudio.timer = setInterval(function () {
        an.getByteTimeDomainData(wave);
        var peak = 0;
        for (var i = 0; i < wave.length; i += 8) { var d = wave[i] - 128; if (d < 0) d = -d; if (d > peak) peak = d; }
        window.__projectorHear.peak = peak;
        window.__projectorHear.playing = opts.sound !== false && !video.paused && video.volume > 0;
      }, 80);
    } catch (e) { console.error('Projektor: Tonmessung', e); }
  }
  function watch(el) {
    if (watching || !el.requestVideoFrameCallback) return;
    watching = true;
    var count = 0, t0 = performance.now();
    function onFrame(now, meta) {
      count++; stat.n++; lastFrame = Date.now();
      // Bild bis zur Anzeige: Aufnahmezeit bis erwartete Anzeige (falls die Quelle sie liefert)
      if (meta && meta.captureTime && meta.expectedDisplayTime) { stat.latSum += meta.expectedDisplayTime - meta.captureTime; stat.latN++; }
      if (fast()) {
        if (now - t0 >= 500) {
          stat.w = el.videoWidth || stat.w; stat.h = el.videoHeight || stat.h;
          var q2 = diagOn && el.getVideoPlaybackQuality && el.getVideoPlaybackQuality();
          if (q2) stat.dropped = q2.droppedVideoFrames || 0;
          stat.fps = Math.round(count * 1000 / (now - t0)); count = 0; t0 = now;
          if (stat.latN) { stat.lat = stat.latSum / stat.latN; stat.latSum = 0; stat.latN = 0; }
          if (!stat.logged && stat.w) { stat.logged = true; console.info('Projektor: natives Bild', stat.w + '×' + stat.h); }
          if (diagOn) paintDiag();
          if (!empty.hidden) empty.hidden = true;
        }
        el.requestVideoFrameCallback(onFrame);
        return;
      }
      stat.w = el.videoWidth || stat.w; stat.h = el.videoHeight || stat.h;
      var q = el.getVideoPlaybackQuality && el.getVideoPlaybackQuality();
      if (q) stat.dropped = q.droppedVideoFrames || 0;
      if (now - t0 >= 500) {
        stat.fps = Math.round(count * 1000 / (now - t0)); count = 0; t0 = now;
        if (stat.latN) { stat.lat = stat.latSum / stat.latN; stat.latSum = 0; stat.latN = 0; }
      }
      if (!stat.logged && stat.w) { stat.logged = true; console.info('Projektor: natives Bild', stat.w + '×' + stat.h); }
      paintDiag();
      empty.hidden = true;
      el.requestVideoFrameCallback(onFrame);
    }
    el.requestVideoFrameCallback(onFrame);
  }
  function takeStream() {
    var feed = window.opener && window.opener.__rlProjectorFeed && window.opener.__rlProjectorFeed();
    var stream = feed && feed.stream;
    if (!stream) { empty.hidden = false; console.warn('Projektor: keine Aufnahme im Elternfenster'); return; }
    if (video.srcObject !== stream) {
      video.srcObject = stream;
      var tracks = stream.getAudioTracks ? stream.getAudioTracks() : [];
      if (!tracks.length) { ahint.hidden = false; ahint.textContent = t('noAudio'); console.warn('Projektor: Quelle ohne Tonspur'); }
      else ahint.hidden = true;
      video.play().catch(function (e) { console.error('Projektor: Wiedergabe', e); });
      if (!fast()) tapAudio(stream);
      watch(video);
      console.info('Projektor: gleiche Aufnahme, kein zweites Gerät');
    }
    applySound();
  }
  setInterval(function () {
    if (diagOn) console.info('Projektor Diagnose', diagText().replace(/\n/g, ' · '));
    else if (stat.n && (!lastFrame || Date.now() - lastFrame > 2000)) console.warn('Projektor: keine neuen Bilder', diagText().replace(/\n/g, ' · '));
  }, 2000);

  // Modus Neu: Overlay per Push (/overlay2, SSE) statt Abfrage alle 0,4 s
  function modeUrl(url) { return fast() ? String(url || '').replace(/(\/\/[^\/?#]+)\/overlay(?=[?#]|$)/, '$1/overlay2') : url; }
  function transparentOverlay(url) {
    url = modeUrl(url);
    if (!url) return '';
    if (/[?&]transparent=1(?:&|$)/.test(url)) return url;
    return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'transparent=1';
  }
  function clampScale(v) {
    v = Math.round(+v);
    if (!isFinite(v)) return 100;
    if (v < 50) return 50;
    if (v > 300) return 300;
    return v;
  }
  function placeCounter(x, y, scale) {
    scale = clampScale(scale);
    var bw = Math.max(1, frame.offsetWidth || 280), bh = Math.max(1, frame.offsetHeight || 120);
    var sw = bw * scale / 100, sh = bh * scale / 100;
    var winW = Math.max(1, window.innerWidth), winH = Math.max(1, window.innerHeight);
    var maxX = Math.max(0, (winW - sw) / winW * 100);
    var maxY = Math.max(0, (winH - sh) / winH * 100);
    x = +x; y = +y;
    if (!isFinite(x)) x = 2;
    if (!isFinite(y)) y = 2;
    if (x < 0) x = 0; if (x > maxX) x = maxX;
    if (y < 0) y = 0; if (y > maxY) y = maxY;
    opts.counterX = Math.round(x * 10) / 10;
    opts.counterY = Math.round(y * 10) / 10;
    opts.counterScale = scale;
    counter.style.left = opts.counterX + '%';
    counter.style.top = opts.counterY + '%';
    counter.style.transform = 'scale(' + (scale / 100) + ')';
  }
  function saveCounter() {
    if (D) D.set({ counterX: opts.counterX, counterY: opts.counterY, counterScale: opts.counterScale });
  }
  function setEdit(on) {
    counterEdit = !!on;
    counter.classList.toggle('edit', counterEdit);
    document.body.classList.toggle('counter-edit', counterEdit);
  }
  var drag = null;
  counter.addEventListener('mousedown', function (ev) {
    if (!counterEdit || ev.button !== 0) return;
    ev.preventDefault();
    drag = { x: ev.clientX, y: ev.clientY, ox: opts.counterX, oy: opts.counterY };
  });
  window.addEventListener('mousemove', function (ev) {
    if (!drag) return;
    placeCounter(drag.ox + (ev.clientX - drag.x) / window.innerWidth * 100, drag.oy + (ev.clientY - drag.y) / window.innerHeight * 100, opts.counterScale);
  });
  window.addEventListener('mouseup', function () { if (!drag) return; drag = null; saveCounter(); });
  counter.addEventListener('wheel', function (ev) {
    if (!counterEdit) return;
    ev.preventDefault();
    placeCounter(opts.counterX, opts.counterY, opts.counterScale * (ev.deltaY < 0 ? 1.08 : 1 / 1.08));
    saveCounter();
  }, { passive: false });
  window.addEventListener('resize', function () { placeCounter(opts.counterX, opts.counterY, opts.counterScale); });
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || d.type !== 'rl-ov-box' || !/^http:\/\/127\.0\.0\.1:\d+$/.test(ev.origin || '')) return;
    var w = Math.max(40, Math.min(1600, Math.round(+d.w) || 0));
    var h = Math.max(40, Math.min(900, Math.round(+d.h) || 0));
    if (!w || !h) return;
    if (frame.offsetWidth !== w) frame.style.width = w + 'px';
    if (frame.offsetHeight !== h) frame.style.height = h + 'px';
    placeCounter(opts.counterX, opts.counterY, opts.counterScale);
  });
  window.__projectorCounter = {
    state: function () {
      var pe = getComputedStyle(counter).pointerEvents;
      return { on: !counter.hidden, x: opts.counterX, y: opts.counterY, scale: opts.counterScale, edit: counterEdit, pointer: pe };
    },
    toggle: function () { if (D) D.set({ overlay: opts.overlay === false }); },
    edit: function (on) { setEdit(on); },
    drag: function (dx, dy) { placeCounter(opts.counterX + dx, opts.counterY + dy, opts.counterScale); saveCounter(); },
    scaleTo: function (s) { placeCounter(opts.counterX, opts.counterY, s); saveCounter(); },
    reset: function () { placeCounter(2, 2, 100); saveCounter(); }
  };
  function apply(o) {
    if (!o) return;
    opts = o;
    lang = o.lang === 'en' ? 'en' : 'de';
    document.documentElement.lang = lang;
    document.documentElement.setAttribute('data-theme', o.theme === 'light' ? 'light' : 'oled');
    document.body.classList.toggle('no-cursor', !!o.hideCursor);
    document.body.classList.toggle('fast', o.mode === 'fast');
    if (o.mode === 'fast' && tapAudio.stop) tapAudio.stop();
    else if (o.mode !== 'fast' && !tapAudio.done && video.srcObject) tapAudio(video.srcObject);
    paintDiag();
    empty.textContent = t('empty');
    if (ahint && ahint.hidden) ahint.textContent = t('noAudio');
    applySound();
    if (o.counterX != null) opts.counterX = o.counterX;
    if (o.counterY != null) opts.counterY = o.counterY;
    if (o.counterScale != null) opts.counterScale = o.counterScale;
    var show = !!(o.overlay && o.overlayUrl);
    counter.hidden = !show;
    if (show) {
      var src = transparentOverlay(o.overlayUrl);
      if (frame.getAttribute('src') !== src) frame.src = src;
      frame.hidden = false;
      placeCounter(opts.counterX, opts.counterY, opts.counterScale);
    } else frame.hidden = true;
    if (!show) setEdit(false);
  }
  function hideMenu() { menu.hidden = true; document.body.classList.remove('menu-open'); }
  function item(label, on, fn) {
    var b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'menuitem');
    var m = document.createElement('span'); m.className = 'mark'; m.textContent = on ? '✓' : '';
    b.appendChild(m); b.appendChild(document.createTextNode(label));
    b.addEventListener('click', function () { hideMenu(); fn(); });
    menu.appendChild(b);
  }
  function sep() { var d = document.createElement('div'); d.className = 'sep'; menu.appendChild(d); }
  function openMenu(x, y) {
    if (!D) return;
    D.displays().then(function (list) {
      menu.innerHTML = '';
      (list || []).forEach(function (d) {
        var on = !!opts.fullscreen && opts.displayId === d.id;
        item(t('mon', d.n, d.w, d.h) + (d.primary ? '' : ''), on, function () {
          D.set({ fullscreen: true, displayId: d.id });
        });
      });
      item(t('win'), !opts.fullscreen, function () { D.set({ fullscreen: false }); });
      sep();
      item(t('onTop'), !!opts.onTop, function () { D.set({ onTop: !opts.onTop }); });
      item(t('cursor'), !!opts.hideCursor, function () { D.set({ hideCursor: !opts.hideCursor }); });
      item(t('counter'), opts.overlay !== false, function () { D.set({ overlay: opts.overlay === false }); });
      item(t('move'), counterEdit, function () { setEdit(!counterEdit); });
      var size = document.createElement('label');
      size.className = 'vol';
      var sizeCap = document.createElement('span'); sizeCap.textContent = t('counterSize');
      var sizeRange = document.createElement('input');
      sizeRange.type = 'range'; sizeRange.min = '50'; sizeRange.max = '300'; sizeRange.step = '10';
      sizeRange.value = String(opts.counterScale || 100);
      sizeRange.setAttribute('aria-label', t('counterSize'));
      sizeRange.addEventListener('input', function () { placeCounter(opts.counterX, opts.counterY, +sizeRange.value); saveCounter(); });
      sizeRange.addEventListener('click', function (ev) { ev.stopPropagation(); });
      size.appendChild(sizeCap); size.appendChild(sizeRange);
      menu.appendChild(size);
      item(t('resetPos'), false, function () { window.__projectorCounter.reset(); });
      item(t('mode'), fast(), function () { D.set({ mode: fast() ? 'classic' : 'fast' }); });
      item(t('diag'), diagOn, function () {
        diagOn = !diagOn;
        paintDiag();
        console.info('Projektor Diagnose', diagOn ? diagText().replace(/\n/g, ' · ') : 'aus');
      });
      sep();
      item(t('sound'), opts.sound !== false, function () { D.set({ sound: opts.sound === false }); });
      var vol = document.createElement('label');
      vol.className = 'vol';
      var cap = document.createElement('span'); cap.textContent = t('volume');
      var range = document.createElement('input');
      range.type = 'range'; range.min = '0'; range.max = '100'; range.step = '1';
      range.value = String(opts.volume == null ? 80 : opts.volume);
      range.setAttribute('aria-label', t('volume'));
      range.addEventListener('input', function () { opts.volume = +range.value; opts.sound = true; D.set({ volume: +range.value, sound: true }); });
      range.addEventListener('click', function (ev) { ev.stopPropagation(); });
      vol.appendChild(cap); vol.appendChild(range);
      menu.appendChild(vol);
      sep();
      item(t('close'), false, function () { D.close(); });
      menu.hidden = false;
      document.body.classList.add('menu-open');
      var mw = menu.offsetWidth, mh = menu.offsetHeight;
      var left = Math.max(4, Math.min(x, window.innerWidth - mw - 4));
      var top = Math.max(4, Math.min(y, window.innerHeight - mh - 4));
      menu.style.left = left + 'px'; menu.style.top = top + 'px';
    }, function () {});
  }
  document.addEventListener('contextmenu', function (ev) {
    ev.preventDefault();
    openMenu(ev.clientX, ev.clientY);
  });
  document.addEventListener('mousedown', function (ev) {
    if (!menu.hidden && !menu.contains(ev.target)) hideMenu();
  });
  window.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (!menu.hidden) { hideMenu(); return; }
      if (counterEdit) { setEdit(false); return; }
      if (D) D.leaveFullscreen();
      return;
    }
    if ((ev.key === 'm' || ev.key === 'M') && !ev.ctrlKey && !ev.altKey && !ev.metaKey && D) {
      ev.preventDefault();
      D.set({ mode: fast() ? 'classic' : 'fast' });
      diagOn = true; paintDiag(); // beim Umschalten die Diagnose zeigen, damit man den Unterschied sieht
      return;
    }
    if ((ev.key === 'h' || ev.key === 'H') && !ev.ctrlKey && !ev.altKey && !ev.metaKey) {
      if (ev.target && /^(INPUT|TEXTAREA)$/.test(ev.target.tagName)) return;
      ev.preventDefault();
      if (D) D.set({ overlay: opts.overlay === false });
    }
  });
  window.addEventListener('blur', hideMenu);
  if (D) {
    D.onOpts(apply);
    D.onShowMenu(function (pos) { openMenu((pos && pos.x) || 28, (pos && pos.y) || 28); });
    D.state().then(function (s) { apply(s); takeStream(); }, function () { takeStream(); });
  } else takeStream();
  window.__projectorFrame = function () { return { w: video.videoWidth || 0, h: video.videoHeight || 0, overlay: !frame.hidden }; };
})();
</script>
</body>
</html>
