<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Teampreview</title>
<!-- Teampreview für OBS (übernommen aus pokemon_team_overlay.py): beide Teams, optional Bank und Closed Team Sheet.
     Browserquelle 1920 × 1080: /match/preview (?bg=solid erzwingt den lila Hintergrund). Daten: /match/state → preview.
     Mit „Start-Screen abspielen“ blendet die Seite /match/start für 15 s ein (?intro=<Sekunden>). -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<style>
.bn2 small{display:block;font-size:.55em;font-weight:700;letter-spacing:.5px;opacity:.9;margin-top:1px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color-scheme:dark light;overflow:hidden}
#view{position:fixed;inset:0;transition:opacity .7s ease}
#view.hid{opacity:0}
#intro{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent;opacity:0;pointer-events:none;transition:opacity .8s ease;z-index:50}
#intro.on{opacity:1}
#view.solid{background:linear-gradient(160deg,#2c1450,#150b25 70%)}
.tlogo{position:absolute;top:52%;width:44vh;height:44vh;transform:translate(-50%,-50%);object-fit:contain;opacity:.22;pointer-events:none;display:none}
#tlogoL{left:25%}#tlogoR{left:75%}
.tlogo.on{display:block}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;backface-visibility:hidden;font-family:"Bahnschrift","Arial Narrow","Segoe UI",system-ui,sans-serif;color:#fff}
/* stage */
.bar{position:absolute;left:64px;right:64px;top:22px;height:80px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:16px}
.pn{font-size:46px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:1px;min-width:0;padding:6px 14px 6px 6px;white-space:nowrap;overflow:hidden;text-shadow:0 3px 8px rgba(0,0,0,.6)}
.pn.right{text-align:right}
.vs{background:#8a4fd0;border:3px solid #d7b8ff;border-radius:50%;width:84px;height:84px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.team{position:absolute;top:122px;width:900px;display:grid;grid-template-columns:440px 440px;gap:15px 20px;align-content:start}
.team.l{left:30px}.team.r{left:990px}
.c{height:288px;border-radius:14px;padding:10px 10px 10px;background:linear-gradient(180deg,#7a37c4,#4f2090);border:3px solid #a672e6;box-shadow:0 6px 16px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:7px}
.h{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 4px}
.nm{font-size:32px;font-weight:800;font-style:italic;text-transform:uppercase;white-space:nowrap;overflow:hidden;flex:1;min-width:0;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.nm{line-height:1.05;padding-right:4px}.nm small{display:block;font-size:.5em;font-weight:700;letter-spacing:.5px;opacity:.92;margin-top:2px}
.ty{display:flex;gap:6px;margin-left:8px;flex:none}
.ty img{width:38px;height:38px}
.s{display:flex;gap:5px;height:40px}
.s>span{display:flex;align-items:center;justify-content:center;border-radius:9px;padding:0 8px;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;min-width:0}
.ab{flex:1 1 100px;background:#2a0f4d;color:#fff}
.s>.na{background:#fff;color:#2a0f4d;flex:none;max-width:285px;justify-content:flex-start;gap:9px;padding:0 10px;font-size:19px}
.na b{font-weight:800}.na i{font-style:normal;font-weight:700;font-size:.9em}
.na .up{color:#d6245f}.na .dn{color:#1769c9}
.b{display:flex;gap:10px;flex:1;min-height:0}
.mv{list-style:none;margin:0;padding:0;width:240px;display:flex;flex-direction:column;gap:6px}
.mv li{flex:1;display:flex;align-items:center;gap:8px;background:#9a5ce0;border:2px solid #c9a4f5;border-radius:9px;padding:0 8px;min-height:0}
.mv li img{width:30px;height:30px;flex:none}
.mv li .fit{font-size:23px;font-weight:700;white-space:nowrap;overflow:hidden;flex:1;min-width:0}
.mv li.e{opacity:.35}
.art{flex:1;background:#3a1566;border:2px solid #a672e6;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 4px 6px;min-width:0}
.sp{width:112px;height:112px;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.c.cl .art{justify-content:center;margin-top:2px}
.c.cl .sp,.c.cl .qm{width:190px;height:190px}
.c.cl .qm{font-size:100px}
.qm{width:112px;height:112px;display:flex;align-items:center;justify-content:center;font-size:60px;color:#a672e6}
.bench{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.bt{height:118px;border-radius:12px;background:linear-gradient(180deg,#6a2fb0,#46207f);border:3px solid #a672e6;box-shadow:0 5px 12px rgba(0,0,0,.45);display:flex;align-items:center;gap:6px;padding:6px;min-width:0;overflow:hidden}
.bs{width:72px;height:96px;display:flex;align-items:center;justify-content:center;background:#3a1566;border-radius:9px;flex:none}
.bs img{width:72px;height:72px;object-fit:contain}
.bi{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.bn2{font-size:23px;font-weight:800;font-style:italic;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.bty{display:flex;gap:5px}.bty img{width:30px;height:30px}
.bit{display:flex;align-items:center;gap:4px;background:#2a0f4d;border-radius:14px;padding:1px 5px 1px 3px;min-width:0;max-width:100%;overflow:hidden}
.bit img{width:20px;height:20px;flex:none}.bit .fit{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;min-width:0;flex:1}
.it{display:flex;align-items:center;gap:6px;background:#2a0f4d;border-radius:20px;padding:2px 10px 2px 4px;max-width:100%;min-width:0}
.it img{width:26px;height:26px;flex:none;image-rendering:auto}
.it .fit{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;min-width:0}
.team.bn{zoom:.88;top:138.6px}
.team.l.bn{left:95.5px}.team.r.bn{left:1186.4px}
.bench{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px 12px}
.bbanner{grid-column:1/-1;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:22px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#e6e3ee;background:repeating-linear-gradient(45deg,#2b2833 0 14px,#383543 14px 28px);border:2px dashed #8b86a0;white-space:nowrap;overflow:hidden}
.bt{height:96px;background:#34313e;border:2px dashed #7a7590;box-shadow:none;border-radius:10px;padding:5px}
.bs{background:#27242f;width:72px;height:82px}
.bs img{width:68px;height:68px;filter:grayscale(1) brightness(.85);opacity:.75}
.bn2{color:#cfcbdc;font-size:21px;font-style:italic}
.bty img{filter:grayscale(1);opacity:.7;width:26px;height:26px}
#bgfx{position:absolute;inset:0;overflow:hidden;display:none;pointer-events:none}
#view.solid #bgfx{display:block}
#bgfx .b{position:absolute;width:75%;aspect-ratio:1;border-radius:50%;will-change:transform}
#bgfx .b1{left:-15%;top:-30%;background:radial-gradient(circle,rgba(160,90,240,.52),rgba(160,90,240,0) 65%);animation:d1 16s ease-in-out infinite alternate}
#bgfx .b2{right:-20%;top:5%;background:radial-gradient(circle,rgba(90,70,230,.46),rgba(90,70,230,0) 65%);animation:d2 19s ease-in-out infinite alternate}
#bgfx .b3{left:20%;bottom:-45%;background:radial-gradient(circle,rgba(210,100,230,.36),rgba(210,100,230,0) 65%);animation:d3 23s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(42%,32%) scale(1.28)}}
@keyframes d2{to{transform:translate(-44%,22%) scale(.82)}}
@keyframes d3{to{transform:translate(34%,-28%) scale(1.28)}}
#bgfx .b4{right:5%;bottom:-30%;width:55%;background:radial-gradient(circle,rgba(120,140,255,.34),rgba(120,140,255,0) 65%);animation:d4 21s ease-in-out infinite alternate}
@keyframes d4{to{transform:translate(-45%,-30%) scale(1.3)}}
#bgfx .rot{position:absolute;left:50%;top:50%;width:190%;aspect-ratio:1;margin-left:-95%;margin-top:-95%;border-radius:50%;background:conic-gradient(from 0deg,rgba(190,120,255,0) 0deg,rgba(190,120,255,.2) 40deg,rgba(190,120,255,0) 90deg,rgba(110,90,255,.18) 190deg,rgba(110,90,255,0) 250deg,rgba(220,120,240,.14) 300deg,rgba(220,120,240,0) 350deg);animation:spin 55s linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
#bgfx .sweep{position:absolute;top:-20%;bottom:-20%;left:-30%;width:22%;transform:rotate(18deg);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(225,200,255,.12),rgba(255,255,255,0));animation:sw 11s ease-in-out infinite;will-change:transform}
@keyframes sw{0%{transform:translateX(0) rotate(18deg);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(620%) rotate(18deg);opacity:0}}
#parts i.ring{background:none;border:2px solid rgba(225,195,255,.28)}
#parts i.ball{background:linear-gradient(transparent 44%,rgba(225,195,255,.3) 44% 56%,transparent 56%);border:2px solid rgba(225,195,255,.28)}
#parts{position:absolute;inset:0}
#parts i{position:absolute;bottom:-30px;border-radius:50%;background:rgba(220,190,255,.2);animation:rise linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translate3d(var(--dx),calc(var(--vh,1000px)*-1.08),0);opacity:0}}
.vs{position:relative}
.vs::after{content:'';position:absolute;inset:-4px;border-radius:50%;box-shadow:0 0 26px 4px rgba(215,184,255,.7);opacity:0;animation:vsg 3.6s ease-in-out infinite;pointer-events:none}
@keyframes vsg{0%,100%{opacity:0}50%{opacity:1}}
</style></head><body>
<div id="view"><div id="bgfx"><i class="rot"></i><i class="b b1"></i><i class="b b2"></i><i class="b b3"></i><i class="b b4"></i><i class="sweep"></i><div id="parts"></div></div><img id="tlogoL" class="tlogo" alt=""><img id="tlogoR" class="tlogo" alt=""><div id="stage"></div></div>
<iframe id="intro" title="Start" scrolling="no"></iframe>
<script>
const $=id=>document.getElementById(id);
// ?export=1: Bild-Export aus der App (electron/match.js): immer sichtbar, ohne Animationen, meldet window.__ready
if(/[?&]export=1/.test(location.search)){const xs=document.createElement('style');xs.textContent='*,*::before,*::after{animation:none!important;transition:none!important}#view.hid{opacity:1!important;visibility:visible!important}';document.head.appendChild(xs);}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const px=u=>u&&(u.indexOf('/')===0||u.indexOf('data:')===0)?u:'/match/img?u='+encodeURIComponent(u);
const FB='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="#cbb8e8" stroke="#fff" stroke-width="2"/><circle cx="16" cy="16" r="4" fill="#fff"/></svg>');
const FBM='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ad9"/><stop offset=".5" stop-color="#7a8cff"/><stop offset="1" stop-color="#5be0c4"/></linearGradient></defs><path d="M16 3 27 12 16 29 5 12Z" fill="url(#g)" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 12H27M16 3 12 12 16 29 20 12 16 3" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2"/></svg>');
let st={show:true,bg:'t',bench:false,closed:false,lang:'de',p1:'',p2:'',team1:[],team2:[],bench1:[],bench2:[]};
const tIcon=t=>'<img alt="" src="/match/types/'+esc(t)+'.png">';
// Bilder: leeren Rand abschneiden (wie mit Pillow im Original), Ergebnis je Adresse merken, damit nichts flackert
const TRIM=new Map();
function trim(img){
  if(img.dataset.t)return;
  const u=img.getAttribute('src');
  if(!u||u.indexOf('data:')===0)return;
  img.dataset.t=1;
  let c=TRIM.get(u);
  if(c===undefined){
    c='x';
    try{
      const w=img.naturalWidth,h=img.naturalHeight;
      if(w&&h){
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');g.drawImage(img,0,0);
        const a=g.getImageData(0,0,w,h).data;let x0=w,x1=-1,y0=h,y1=-1;
        for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(a[(y*w+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
        if(x1>=0&&(x0>0||y0>0||x1<w-1||y1<h-1)){
          const cw=x1-x0+1,ch=y1-y0+1,k=Math.min(1,300/Math.max(cw,ch)),o=document.createElement('canvas');
          o.width=Math.round(cw*k);o.height=Math.round(ch*k);const og=o.getContext('2d');og.imageSmoothingQuality='high';
          og.drawImage(cv,x0,y0,cw,ch,0,0,o.width,o.height);c=o.toDataURL('image/png');
        }
      }
    }catch(e){c='x';}
    TRIM.set(u,c);
  }
  if(c!=='x')img.src=c;
}
// Bild mit Ausweich-Adressen; kind 1 = Karte, 2 = Bank
function spImg(cls,list,kind){
  const l=(list||[]).map(px);
  if(!l.length)return kind===2?'<div class="qm" style="width:68px;height:68px;font-size:36px">?</div>':'<div class="qm">?</div>';
  const done=TRIM.get(l[0]);
  return '<img'+(cls?' class="'+cls+'"':'')+' alt="" data-l="'+esc(JSON.stringify(l))+'" data-i="0" data-k="'+kind+'"'+(done&&done!=='x'?' data-t="1" src="'+done+'"':' src="'+esc(l[0])+'"')+' onload="trim(this)" onerror="imgFail(this)">';
}
function imgFail(el){
  const l=JSON.parse(el.dataset.l||'[]'),i=+el.dataset.i+1,kind=+el.dataset.k;
  if(kind===3){el.onerror=null;el.src=el.dataset.f||FB;return;}
  delete el.dataset.t;
  if(i<l.length){el.dataset.i=i;el.src=l[i];return;}
  // alle Quellen versucht: noch zweimal von vorn (Netz kann kurz weg sein), dann Platzhalter
  const r=(+el.dataset.r||0)+1;el.dataset.r=r;
  if(r<=2){setTimeout(()=>{el.dataset.i=0;el.src=l[0]+(l[0].includes('?')?'&':'?')+'r='+r;},1500*r);return;}
  el.onerror=null;
  el.outerHTML=kind===2?'<div class="qm" style="width:68px;height:68px;font-size:36px">?</div>':'<div class="qm">?</div>';
}
function vsHtml(){
  const FONT='900 40px "Bahnschrift","Arial Narrow","Segoe UI",system-ui,sans-serif';
  const SK=Math.tan(12*Math.PI/180),Z=4,N=78*Z;
  const cv=document.createElement('canvas');cv.width=cv.height=N;const c=cv.getContext('2d');
  c.font=FONT;
  const m=c.measureText('VS');
  let x=39-(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2,y=39+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2;
  c.setTransform(Z,0,0,Z,0,0);c.translate(39,39);c.transform(1,0,-SK,1,0,0);c.translate(-39,-39);
  c.fillStyle='#fff';c.fillText('VS',x,y);
  const d=c.getImageData(0,0,N,N).data;let x0=N,x1=0,y0=N,y1=0;
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){if(d[(j*N+i)*4+3]>40){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j;}}
  if(x1>x0){x+=39-((x0+x1+1)/2)/Z;y+=39-((y0+y1+1)/2)/Z;}
  return '<div class="vs"><svg viewBox="0 0 78 78" width="78" height="78"><text x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" fill="#fff" style="font:'+FONT.replace(/"/g,"'")+'" transform="translate(39 39) skewX(-12) translate(-39 -39)">VS</text></svg></div>';
}
function nmBench(n,l){
  let m;
  if(m=n.match(/^(.*?) \((.+)\)$/))return esc(m[1])+'<small>'+esc(m[2])+'</small>';
  if(l==='de'){
    if(m=n.match(/^(Alola|Galar|Hisui|Paldea)-(.+)$/))return esc(m[2])+'<small>'+m[1]+'-Form</small>';
    if(m=n.match(/^Mega-(.+)$/))return esc(m[1])+'<small>Mega</small>';
  }else{
    if(m=n.match(/^(Alolan|Galarian|Hisuian|Paldean) (.+)$/))return esc(m[2])+'<small>'+m[1]+' Form</small>';
    if(m=n.match(/^Mega (.+)$/))return esc(m[1])+'<small>Mega</small>';
  }
  return esc(n);
}
function nmHtml(n){n=String(n||'');const k=n.indexOf(' (');if(k>0&&n.endsWith(')'))return esc(n.slice(0,k))+'<small>'+esc(n.slice(k+1))+'</small>';return esc(n);}
function card(m){
  const types=(m.types||[]).map(tIcon).join('');
  if(st.closed){
    return '<div class="c cl"><div class="h"><span class="nm fit">'+nmHtml(m.name)+'</span><span class="ty">'+types+'</span></div><div class="art">'+spImg('sp',m.sprites,1)+'</div></div>';
  }
  const mv=(m.moves||[]).slice(0,4).map(x=>'<li>'+tIcon(x.t||'normal')+'<span class="fit">'+esc(x.n)+'</span></li>');
  while(mv.length<4)mv.push('<li class="e"></li>');
  const boost=m.up?'<i class="up">↑ '+esc(m.up)+'</i><i class="dn">↓ '+esc(m.dn)+'</i>':'';
  const it=m.item;
  const itHtml=it?'<div class="it"><img alt="" data-k="3" data-f="'+(it.mega?FBM:FB)+'" src="'+esc(it.icon)+'" onerror="imgFail(this)"><span class="fit">'+esc(it.n)+'</span></div>':'<div></div>';
  return '<div class="c"><div class="h"><span class="nm fit">'+nmHtml(m.name)+'</span><span class="ty">'+types+'</span></div>'
   +'<div class="s"><span class="ab fit">'+esc(m.ability||'–')+'</span><span class="na fit"><b>'+esc(m.nature||'–')+'</b>'+boost+'</span></div>'
   +'<div class="b"><ul class="mv">'+mv.join('')+'</ul><div class="art">'+spImg('sp',m.sprites,1)+itHtml+'</div></div></div>';
}
function bcard(m,l){
  const types=(m.types||[]).map(tIcon).join('');
  return '<div class="bt"><div class="bs">'+spImg('',m.sprites,2)+'</div><div class="bi"><span class="bn2 fit">'+nmBench(m.name||'',l)+'</span><span class="bty">'+types+'</span></div></div>';
}
function teamHtml(mons,cls,hb,bn){
  const main=(mons||[]).slice(0,6).map(card).join('');
  const bt=st.lang==='en'?'On the bench':'Auf der Bank';
  return '<div class="team '+cls+(hb?' bn':'')+'">'+main+(bn&&bn.length?'<div class="bench"><div class="bbanner fit">'+bt+'</div>'+bn.map(m=>bcard(m,st.lang)).join('')+'</div>':'')+'</div>';
}
function render(){
  const bk1=st.bench?(st.bench1||[]).slice(0,4):[],bk2=st.bench?(st.bench2||[]).slice(0,4):[];
  const hb=st.bench&&(bk1.length||bk2.length);
  $('stage').innerHTML='<div class="bar"><div class="pn">'+esc(st.p1)+'</div>'+vsHtml()+'<div class="pn right">'+esc(st.p2)+'</div></div>'
   +teamHtml(st.team1,'l',hb,bk1)+teamHtml(st.team2,'r',hb,bk2);
  $('stage').querySelectorAll('.fit,.pn').forEach(e=>{let s=parseFloat(getComputedStyle(e).fontSize);while(e.scrollWidth>e.clientWidth+1&&s>9){s-=.5;e.style.fontSize=s+'px';}});
  const bgp=new URLSearchParams(location.search).get('bg');
  $('view').classList.toggle('solid',bgp?bgp==='solid':st.bg==='s');
  $('view').classList.toggle('hid',st.show===false);
  fitStage();
}
function initParts(){
  const box=$('parts');let h='',r=7;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280;};
  for(let i=0;i<30;i++){const k=rnd(),cls=k<.2?' class="ring"':k<.3?' class="ball"':'',s=(cls?14+rnd()*22:5+rnd()*13),dur=13+rnd()*20;
    h+='<i'+cls+' style="left:'+(rnd()*100).toFixed(1)+'%;width:'+s.toFixed(1)+'px;height:'+s.toFixed(1)+'px;--dx:'+((rnd()-.5)*260).toFixed(0)+'px;animation-duration:'+dur.toFixed(1)+'s;animation-delay:-'+(rnd()*dur).toFixed(1)+'s"></i>';}
  box.innerHTML=h;
}
function fitStage(){
  $('view').style.setProperty('--vh',$('view').clientHeight+'px');
  const v=$('view'),w=v.clientWidth,h=v.clientHeight,s=Math.min(w/1920,h/1080);
  $('stage').style.transform='translate3d('+Math.round((w-1920*s)/2)+'px,'+Math.round((h-1080*s)/2)+'px,0) scale('+s+')';
}
window.addEventListener('resize',fitStage);
// Start-Screen: per Knopf in der App wird /match/start eingeblendet, nach INTRO_MS wechselt es zu den Teams
const INTRO_MS=Math.max(1,+(new URLSearchParams(location.search).get('intro')||15))*1000;
let introPlay=null,introTimer=null,hideTimer=null;
function playIntro(n){
  const f=$('intro'),v=$('view');clearTimeout(introTimer);clearTimeout(hideTimer);
  // die Teams darunter werden während des Start-Screens nicht gezeichnet (spart viel FPS)
  f.onload=()=>{f.onload=null;f.classList.add('on');
    hideTimer=setTimeout(()=>{v.style.visibility='hidden';},1000);
    introTimer=setTimeout(()=>{v.style.visibility='';f.classList.remove('on');introTimer=setTimeout(()=>{f.removeAttribute('src');},1000);},INTRO_MS);};
  f.src='/match/start?auto=1&n='+n;
}
// Jedes Teamlogo mittig hinter seinem Team (links 25 %, rechts 75 % der Breite)
const logoKeys={L:'',R:''};
function setTeamLogo(l,r){
  [['L',l],['R',r]].forEach(([k,v])=>{
    const img=$('tlogo'+k),key=v?String(v):'';
    if(logoKeys[k]===key)return;
    logoKeys[k]=key;
    if(!key){img.classList.remove('on');img.removeAttribute('src');return;}
    img.src='/match/logo/'+k+'?v='+v;img.classList.add('on');
  });
}
let last='',bootId=null;
async function poll(){
  try{
    const d=await (await fetch('/match/state',{cache:'no-store'})).json();
    if(bootId&&d.v!==bootId){location.reload();return;}
    bootId=d.v;
    if(introPlay!==null&&d.play!==introPlay)playIntro(d.play);
    introPlay=d.play;
    setTeamLogo(d.logoL,d.logoR);
    const j=JSON.stringify(d.preview||{});
    if(j===last){window.__ready=true;return;}
    last=j;st=Object.assign(st,d.preview||{});
    render();window.__ready=true;
  }catch(e){}
}
initParts();render();poll();setInterval(poll,1000);
</script></body></html>
