<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Matchup-Banner</title>
<!-- Matchup-Banner für OBS (übernommen aus pokemon_team_overlay.py): Namen, Standing, Spielstand, Woche, Teamlogos.
     Browserquelle 1920 × 200: /match/matchup. Daten: /match/state → match. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;color-scheme:dark light;overflow:hidden}
#view{position:fixed;inset:0;transition:opacity .7s ease}
#view.hid{opacity:0}
#stage{position:absolute;left:0;top:0;width:1920px;height:200px;transform-origin:0 0;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;backface-visibility:hidden;font-family:"Bahnschrift","Arial Narrow","Segoe UI",system-ui,sans-serif;color:#fff}
.mp{position:absolute;top:58px;width:700px;height:84px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px;background:linear-gradient(180deg,#7a37c4,#4f2090);border:3px solid #a672e6;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.mp.l{left:30px}
.mp.r{right:30px;flex-direction:row-reverse}
#stage.hasL .mp.l{left:365px;width:455px}
#stage.hasR .mp.r{right:365px;width:455px}
.lgb{position:absolute;top:0;width:360px;height:200px;display:none;align-items:center;justify-content:center;overflow:hidden;background:#170a2b}
.lgb img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.lgb.l{left:0}.lgb.r{right:0}.lgb.l img{object-position:left center}.lgb.r img{object-position:right center}
.lgb img.bg{object-fit:cover!important;object-position:center!important;filter:blur(16px) brightness(.5);transform:scale(1.3)}
.lgb img.fg{object-fit:contain!important;object-position:center!important}
#stage.hasL .lgb.l,#stage.hasR .lgb.r{display:flex}
.nm{flex:1;min-width:0;overflow:hidden;white-space:nowrap;font-size:34px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:1px;line-height:1.1;padding:2px 8px 2px 2px;text-shadow:0 3px 8px rgba(0,0,0,.6)}
.mp.r .nm{text-align:right;padding:2px 2px 2px 8px}
.rc{flex:none;background:#3a1566;border:2px solid #a672e6;border-radius:9px;padding:4px 12px;font-size:22px;font-weight:700;white-space:nowrap}
.sc{flex:none;width:58px;height:58px;display:flex;align-items:center;justify-content:center;padding:3px 6px 0 0;border-radius:12px;background:#fff;color:#2a0f4d;font-size:40px;font-weight:800;font-style:italic;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.sc.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
.hide{display:none}
#wk{position:absolute;left:830px;top:10px;width:260px;height:180px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 18px;overflow:hidden;white-space:pre-line;border-radius:14px;background:linear-gradient(180deg,#8a4fd0,#5a2aa0);border:3px solid #d7b8ff;box-shadow:0 4px 14px rgba(0,0,0,.5);font-size:34px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:1px;line-height:1.08;text-shadow:0 3px 8px rgba(0,0,0,.5)}
#wkb{position:absolute;left:830px;top:10px;width:260px;height:180px;border-radius:14px;pointer-events:none}
#wkb::after{content:'';position:absolute;inset:-4px;border-radius:18px;box-shadow:0 0 26px 4px rgba(215,184,255,.7);opacity:0;animation:vsg 3.6s ease-in-out infinite}
@keyframes vsg{0%,100%{opacity:0}50%{opacity:1}}
</style></head><body>
<div id="view"><div id="stage">
  <div class="lgb l" id="clgL"></div><div class="lgb r" id="clgR"></div>
  <div class="mp l"><div class="nm" id="nameL"></div><div class="rc" id="recL"></div><div class="sc" id="scoreL"></div></div>
  <div id="wkb"></div><div id="wk"></div>
  <div class="mp r"><div class="nm" id="nameR"></div><div class="rc" id="recR"></div><div class="sc" id="scoreR"></div></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
// ?export=1: Bild-Export aus der App (electron/match.js): immer sichtbar, ohne Animationen, meldet window.__ready
if(/[?&]export=1/.test(location.search)){const xs=document.createElement('style');xs.textContent='*,*::before,*::after{animation:none!important;transition:none!important}#view.hid{opacity:1!important;visibility:visible!important}';document.head.appendChild(xs);}
let last='',boot=null,prev=null;
function fitAll(){
  document.querySelectorAll('.nm').forEach(e=>{
    e.style.fontSize='';let s=parseFloat(getComputedStyle(e).fontSize);
    while(e.scrollWidth>e.clientWidth+1&&s>10){s-=.5;e.style.fontSize=s+'px';}
  });
  const w=$('wk');w.style.fontSize='';let s=parseFloat(getComputedStyle(w).fontSize);
  while((w.scrollWidth>w.clientWidth+1||w.scrollHeight>w.clientHeight+1)&&s>12){s-=.5;w.style.fontSize=s+'px';}
}
function fitStage(){
  const v=$('view'),w=v.clientWidth,h=v.clientHeight,s=Math.min(w/1920,h/200);
  $('stage').style.transform='translate3d('+Math.round((w-1920*s)/2)+'px,'+Math.round((h-200*s)/2)+'px,0) scale('+s+')';
}
function pop(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
function render(m){
  for(const k of ['L','R']){
    $('name'+k).textContent=m['name'+k]||'';
    $('rec'+k).textContent=m['rec'+k]||'';$('rec'+k).classList.toggle('hide',!m['rec'+k]);
    $('score'+k).textContent=m['score'+k]||0;
    if(prev&&prev['score'+k]!==m['score'+k])pop($('score'+k));
    const box=$('clg'+k),v=m['logo'+k];
    if(!prev||prev['logo'+k]!==v){box.innerHTML='';if(v){const i=document.createElement('img');i.src='/match/logo/'+k+'?v='+v;i.alt='';i.className='bg';box.appendChild(i);const j=document.createElement('img');j.src=i.src;j.alt='';j.className='fg';box.appendChild(j);}}
    $('stage').classList.toggle('has'+k,!!v);
  }
  $('wk').textContent=m.week||'';
  $('view').classList.toggle('hid',m.show===false);
  fitAll();fitStage();
}
async function poll(){
  try{
    const d=await (await fetch('/match/state',{cache:'no-store'})).json();
    if(boot&&d.v!==boot){location.reload();return;}
    boot=d.v;
    const m=Object.assign({},d.match||{},{logoL:d.logoL,logoR:d.logoR});
    const j=JSON.stringify(m);
    if(j===last){window.__ready=true;return;}
    last=j;render(m);prev=m;window.__ready=true;
  }catch(e){}
}
window.addEventListener('resize',fitStage);
fitStage();poll();setInterval(poll,1000);
</script></body></html>
