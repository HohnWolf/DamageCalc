  <script>
  /* Theme & UI style before first paint. cc_theme is JSON (same as js/app.js save); older builds only stored cc_light. */
  (function () {
    var ok = { oled: 1, light: 1 };
    var okStyle = { pro: 1, studio: 1 };
    var theme = 'oled', uiStyle = 'pro';
    try {
      var raw = localStorage.getItem('cc_theme');
      var t = raw ? JSON.parse(raw) : null;
      if (ok[t]) theme = t;
      else if (JSON.parse(localStorage.getItem('cc_light') || 'false')) theme = 'light';
      var sRaw = localStorage.getItem('cc_settings');
      var st = sRaw ? JSON.parse(sRaw) : null;
      if (st && okStyle[st.uiStyle]) uiStyle = st.uiStyle;
    } catch (e) { /* keep defaults */ }
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.setAttribute('data-ui-style', uiStyle);
  })();
  </script>
