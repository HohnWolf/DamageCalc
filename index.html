<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rattata Lab</title>
  <meta name="description" content="Damage Calculator, Teambuilder, Shiny-Zähler, Kampfprotokoll und Match-Analyse für Pokémon Champions (VGC 2026).">
  <link rel="icon" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css?v=64">
  <link rel="stylesheet" href="css/views.css?v=64">
  <link rel="stylesheet" href="css/nuz.css?v=64">
  <link rel="stylesheet" href="css/shiny.css?v=64">
  <link rel="stylesheet" href="css/battlelog.css?v=65">
  <link rel="stylesheet" href="css/match.css?v=64">
</head>
<body data-view="start">
  <header class="topbar" id="topbar">
    <button id="btnHome" class="brand-btn" data-tt="homeTitle"><img src="img/logo.png" alt=""><span class="brand">Rattata Lab</span></button>
    <nav class="view-nav" id="viewNav"></nav>
    <span class="sub only-calc" data-t="sub">VGC 2026 · Level 50 · Stat Points (max. 32 je Wert, 66 gesamt) · Reg M-C</span>
    <button id="btnUpdate" class="pill update-pill" hidden></button>
    <div class="top-actions">
      <button id="btnOpenImport" class="pill primary only-calc" data-t="importBtn">Team importieren</button>
      <button id="btnSets" class="pill no-start" data-t="setsBtn" data-tt="setsTitle">Sets laden</button>
      <button id="btnReg" class="pill no-start" data-t="regBtn" data-tt="regTitle">Regulation laden</button>
      <button id="btnSwap" class="pill only-calc" data-t="swapBtn" data-tt="swapTitle">Seiten tauschen</button>
      <button id="btnSettings" class="pill icon-pill" data-tt="setBtn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
    <div class="win-controls" id="winControls" hidden>
      <button id="winMin" data-tt="winMin"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
      <button id="winMax" data-tt="winMax"><svg class="ic-max" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg><svg class="ic-restore" viewBox="0 0 10 10"><rect x=".5" y="2.5" width="7" height="7"/><path d="M2.5 2.5V.5h7v7h-2"/></svg></button>
      <button id="winClose" class="close" data-tt="winClose"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </header>

  <section id="startView" class="start-view">
    <div class="start-inner">
      <img class="start-logo" src="img/logo.png" alt="">
      <h1>Rattata Lab</h1>
      <p class="start-sub" id="startSub">Damage Calculator, Teambuilder, Shiny-Zähler, Kampfprotokoll und Match-Analyse für Pokémon Champions</p>
      <div class="start-cards">
        <button class="start-card card-calc" data-go="calc">
          <span class="sc-art sc-art-calc">
            <span class="sc-dmg">156 – 184 <small>(82,1 – 96,8 %)</small></span>
            <span class="sc-bar"><span style="width:88%"></span></span>
            <span class="sc-ko" data-t="startCalcKo">43,8 % Chance auf OHKO</span>
          </span>
          <span class="sc-head"><span class="sc-title" data-t="navCalc">Damage Calculator</span><span class="sc-key">1</span></span>
          <span class="sc-text" data-t="startCalcText"></span>
        </button>
        <button class="start-card card-builder" data-go="builder">
          <span class="sc-art sc-art-builder" id="startTeam"></span>
          <span class="sc-head"><span class="sc-title" data-t="navBuilder">Teambuilder</span><span class="sc-key">2</span></span>
          <span class="sc-text" data-t="startBuilderText"></span>
        </button>
        <button class="start-card card-sl" data-go="soullink">
          <span class="sc-art sc-art-nuz" id="startSL"></span>
          <span class="sc-head"><span class="sc-title" data-t="navSL">Soul Link</span><span class="sc-key">3</span></span>
          <span class="sc-text" data-t="startSLText"></span>
        </button>
        <button class="start-card card-nuz" data-go="nuz">
          <span class="sc-art sc-art-nc">
            <span class="sc-nc-line"><span>ROM</span><span class="sc-plus">+</span><span>.sav</span></span>
            <span class="sc-bar"><span style="width:62%"></span></span>
            <span class="sc-ko" data-t="startNuzKo">Gen 3 · Trainer, Box, Schaden</span>
          </span>
          <span class="sc-head"><span class="sc-title"><span data-t="navNuz">Nuzlocke</span><span class="alpha-badge">ALPHA</span></span><span class="sc-key">4</span></span>
          <span class="sc-text" data-t="startNuzText"></span>
        </button>
        <button class="start-card card-shiny" data-go="shiny">
          <span class="sc-art sc-art-shiny" id="startShiny"></span>
          <span class="sc-head"><span class="sc-title" data-t="navShiny">Shiny-Zähler</span><span class="sc-key">5</span></span>
          <span class="sc-text" data-t="startShinyText"></span>
        </button>
        <button class="start-card card-bl" data-go="battlelog">
          <span class="sc-art sc-art-bl">
            <span class="sc-bl-line">Runde 1 · Glurak</span>
            <span class="sc-bl-line dim">Flammenwurf · sehr effektiv</span>
            <span class="sc-bar"><span style="width:52%"></span></span>
          </span>
          <span class="sc-head"><span class="sc-title"><span data-t="navBattle">Kampfprotokoll</span><span class="alpha-badge">ALPHA</span></span><span class="sc-key">6</span></span>
          <span class="sc-text" data-t="startBattleText"></span>
        </button>
        <button class="start-card card-match" data-go="match">
          <span class="sc-art sc-art-match">
            <span class="sc-dmg">8–4 <small>66,7 %</small></span>
            <span class="sc-bar"><span style="width:67%"></span></span>
            <span class="sc-ko">Bo3 · Leads · Matchups</span>
          </span>
          <span class="sc-head"><span class="sc-title">Match-Analyse</span><span class="sc-key">7</span></span>
          <span class="sc-text" data-t="startMatchText"></span>
        </button>
      </div>
      <p class="start-foot" data-t="startFoot"></p>
    </div>
  </section>

  <main id="builderView" class="wrap builder-view"></main>
  <main id="slView" class="wrap sl-view"></main>
  <main id="nuzView" class="wrap nuz-view"></main>
  <main id="shinyView" class="wrap shiny-view"></main>
  <main id="battleView" class="wrap battle-view"></main>
  <main id="matchView" class="wrap match-view"></main>

  <main class="wrap calc-view" id="calcView">
    <section class="main-result" id="mainResult">
      <div id="mainDesc" class="main-desc" data-tt="copyTitle"></div>
      <div class="main-sub"><span id="mainRolls" class="main-rolls"></span><span id="mainNotes" class="main-notes"></span><span id="turnOrder" class="turn-order"></span></div>
    </section>

    <section class="columns">
      <div class="panel poke-panel" id="panel1"></div>
      <div class="panel field-panel" id="fieldPanel"></div>
      <div class="panel poke-panel" id="panel2"></div>
    </section>
  </main>

  <!-- Team import dialog -->
  <div id="importModal" class="modal hidden">
    <div class="modal-box wide">
      <div class="modal-head">
        <h3 data-t="importTitle">Team-Import (Showdown-Format)</h3>
        <button id="importClose" class="icon-btn" data-tt="close">✕</button>
      </div>
      <p class="hint" data-th="importHintH"></p>
      <textarea id="importText" spellcheck="false" placeholder="Garchomp @ Garchompite&#10;Ability: Rough Skin&#10;Level: 50&#10;SPs: 2 HP / 32 Atk / 32 Spe&#10;Jolly Nature&#10;- Earthquake&#10;- Dragon Claw&#10;- Rock Slide&#10;- Protect"></textarea>
      <div class="import-actions">
        <button id="btnImportLeft" data-t="importLeft">In linkes Team (eigene Seite)</button>
        <button id="btnImportRight" data-t="importRight">In rechtes Team (Gegner)</button>
        <button id="btnImportCustom" data-t="importCustom">Als eigene Sets speichern</button>
        <span id="importMsg" class="hint"></span>
      </div>
      <div class="import-actions split">
        <button id="btnDeleteCustom" class="danger" data-t="deleteCustom">Alle eigenen Sets löschen</button>
        <button id="btnResetOnline" class="danger" data-t="resetOnline">Online-Daten zurücksetzen</button>
        <span class="hint" data-th="creditsH"></span>
      </div>
    </div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h3 id="modalTitle">Export</h3>
      <textarea id="modalText" spellcheck="false"></textarea>
      <div class="import-actions">
        <button id="modalCopy" data-t="copy">Kopieren</button>
        <button id="modalClose" data-t="close">Schließen</button>
      </div>
    </div>
  </div>

  <script src="js/shim.js?v=64"></script>
  <script src="data/pokedex.js?v=64"></script>
  <script src="data/move_data.js?v=64"></script>
  <script src="data/move_acc.js?v=64"></script>
  <script src="data/forms_champ.js?v=64"></script>
  <script src="data/item_data.js?v=64"></script>
  <script src="data/ability_data.js?v=64"></script>
  <script src="data/setdex_ncp-g10.js?v=64"></script>
  <script src="data/names_de.js?v=64"></script>
  <script src="data/learnsets_champ.js?v=64"></script>
  <script src="data/sprite_boxes.js?v=64"></script>
  <script src="js/online.js?v=64"></script>
  <script src="js/calc.js?v=64"></script>
  <script src="js/app.js?v=64"></script>
  <script src="js/builder.js?v=64"></script>
  <script src="data/natdex.js?v=64"></script>
  <script src="data/gen3_names.js?v=64"></script>
  <script src="js/gen3.js?v=64"></script>
  <script src="data/nds_names.js?v=64"></script>
  <script src="js/nds_calc.js?v=64"></script>
  <script src="js/nds.js?v=64"></script>
  <script src="js/nuz.js?v=64"></script>
  <script src="js/nuzcalc.js?v=64"></script>
  <script src="js/shiny_odds.js?v=64"></script>
  <script src="js/textprep.js?v=65"></script>
  <script src="js/capture.js?v=65"></script>
  <script src="js/shiny_detect.js?v=64"></script>
  <script src="js/shiny.js?v=64"></script>
  <script src="js/battlelog.js?v=65"></script>
  <script src="js/match_parse.js?v=64"></script>
  <script src="js/match.js?v=64"></script>
</body>
</html>
