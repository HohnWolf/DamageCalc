# Baut die Android-App (mobile/) und hängt die APK an das Release
name: Android
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Web-App für Android bauen
        working-directory: mobile
        run: |
          npm ci
          node build-web.js
          npx cap sync android
      - name: Signaturschlüssel bereitstellen
        env:
          KS_B64: "${{ secrets.ANDROID_KEYSTORE_B64 }}"
        run: |
          if [ -z "$KS_B64" ]; then
            if [ "${{ github.event_name }}" = "release" ]; then echo "::error::Secret ANDROID_KEYSTORE_B64 fehlt: ohne feste Signatur kann die App sich nicht aktualisieren (siehe README)"; exit 1; fi
            echo "Kein Schlüssel: Test-APK mit Debug-Signatur"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rattata.p12"
            echo "RL_KEYSTORE=$RUNNER_TEMP/rattata.p12" >> "$GITHUB_ENV"
          fi
      - name: APK bauen
        working-directory: mobile/android
        env:
          RL_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          RL_KEY_ALIAS: "${{ secrets.ANDROID_KEY_ALIAS }}"
          RL_KEY_PASSWORD: "${{ secrets.ANDROID_KEY_PASSWORD }}"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: APK umbenennen
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk RattataLab-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: RattataLab-android, path: RattataLab-android.apk }
      - name: An das Release hängen
        if: github.event_name == 'release'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name }}" RattataLab-android.apk --clobber
