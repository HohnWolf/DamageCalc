# Baut die Android-App (mobile/) und hängt die APK an das Release
name: Android
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Web-App für Android bauen
        working-directory: mobile
        run: |
          npm ci
          node build-web.js
          npx cap sync android
      - name: APK bauen
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: APK umbenennen
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk RattataLab-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: RattataLab-android, path: RattataLab-android.apk }
      - name: An das Release hängen
        if: github.event_name == 'release'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "${{ github.event.release.tag_name }}" RattataLab-android.apk --clobber
